
name: Practical 2 - Student Result ML CI

on:
  push:
    paths:
      - "Practical-2-ML-CI/**"
      - ".github/workflows/practical-2-ml-ci.yml"
  pull_request:
    paths:
      - "Practical-2-ML-CI/**"
      - ".github/workflows/practical-2-ml-ci.yml"
  workflow_dispatch:

jobs:
  test-ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Practical-2-ML-CI/requirements.txt

      - name: Run ML pipeline tests
        working-directory: Practical-2-ML-CI
        run: python -m unittest test_ml_pipeline.py -v
